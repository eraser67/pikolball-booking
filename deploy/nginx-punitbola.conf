# Nginx configuration for punitbola.tech and *.punitbola.tech
# Reverse proxy to ASP.NET Core Kestrel (127.0.0.1:5000)

server {
    listen 80;
    listen [::]:80;
    server_name punitbola.tech *.punitbola.tech;

    # Allow Let's Encrypt HTTP-01 challenge if needed
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name punitbola.tech *.punitbola.tech;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/pikolball.punitbola.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pikolball.punitbola.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Max upload limit (accommodates 3 MB court images and 1 MB payment proofs)
    client_max_body_size 10M;

    # Proxy headers preserving original Host and Scheme for tenant resolution
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
