server {
    listen 80;
    listen [::]:80;
    server_name courthaus-carmen.punitbola.tech;

    location / {
        return 301 https://courthauscarmen.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name courthaus-carmen.punitbola.tech;

    ssl_certificate /etc/letsencrypt/live/wildcard.punitbola.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard.punitbola.tech/privkey.pem;

    return 301 https://courthauscarmen.tech$request_uri;
}
